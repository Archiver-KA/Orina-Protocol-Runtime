name: Protocol Release Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_connected_smoke:
        description: Run the connected MetaMask protocol smoke on a self-hosted Windows runner.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  viewer-release:
    name: Viewer Release Gate
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.7.8

      - name: Install dependencies
        run: npm ci

      - name: Run repository tooling verification
        run: npm run verify:repo-tooling

      - name: Run typecheck baseline
        run: npm run typecheck

      - name: Run ESLint baseline
        run: npm run lint:check

      - name: Run security scan
        run: npm run security:scan

      - name: Audit and typecheck Edge dependencies
        run: |
          npm run security:audit-edge
          npm run typecheck:edge

      - name: Run marketplace freshness verification
        run: npm run verify:marketplace-freshness

      - name: Run viewer release verification
        run: npm run verify:viewer-release

      - name: Run deterministic build verification
        run: npm run verify:deterministic-build

      - name: Generate SBOM
        run: npm run security:sbom

      - name: Generate unsigned release manifest
        run: npm run release:manifest

      - name: Upload release provenance artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-provenance-${{ github.sha }}
          if-no-files-found: error
          path: |
            audit/sbom.cdx.json
            audit/release-manifest.unsigned.json

      - name: Assert public SEO artifacts
        shell: bash
        run: |
          test -f dist/sitemap.xml
          test -f dist/sitemap-core.xml
          test -f dist/sitemap-assets.xml
          test -f dist/sitemap-profiles.xml
          test -f dist/sitemap-collections.xml
          test -f dist/sitemap-categories.xml

  supabase-security-audit:
    name: Supabase Security Audit (Advisory)
    needs:
      - viewer-release
    if: ${{ needs.viewer-release.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_AUDIT_URL: ${{ secrets.SUPABASE_DB_AUDIT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Supabase SECURITY DEFINER audit
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_AUDIT_URL" ]; then
            echo "::warning::SUPABASE_DB_AUDIT_URL is not configured; skipping advisory live audit."
            exit 0
          fi
          set +e
          npm run audit:supabase:security-definer -- --db-url "$SUPABASE_DB_AUDIT_URL"
          audit_status=$?
          set -e
          if [ "$audit_status" -ne 0 ]; then
            echo "::warning::Live SECURITY DEFINER drift detected. Frontend verification remains advisory; backend deployment stays blocked until the dedicated workflow audit passes."
          fi
          exit 0

  connected-protocol-smoke:
    name: Connected Protocol Smoke
    needs:
      - viewer-release
    if: ${{ needs.viewer-release.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_connected_smoke }}
    runs-on:
      - self-hosted
      - Windows
      - protocol-smoke
    timeout-minutes: 15
    environment: wallet-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Chrome DevTools endpoint
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri 'http://127.0.0.1:9222/json/version' -UseBasicParsing
          if ($response.StatusCode -ne 200) {
            throw 'Chrome DevTools endpoint is not ready on http://127.0.0.1:9222.'
          }

      - name: Check local protocol viewer
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri 'http://localhost:5173/' -UseBasicParsing
          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
            throw 'Local protocol viewer is not ready on http://localhost:5173/.'
          }

      - name: Run connected MetaMask smoke
        run: npm run smoke:connected:protocol
